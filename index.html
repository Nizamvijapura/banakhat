<!doctype html><html lang="gu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>જમીન બાનાખત</title><style>
*{box-sizing:border-box}body{font-family:"Noto Sans Gujarati","Nirmala UI",Arial;background:#eef2f7;margin:0;color:#172033}.wrap{max-width:1200px;margin:auto;padding:12px}.head{background:linear-gradient(100deg,#0d4da3,#1d7180);color:white;padding:18px;border-radius:12px}.head h1{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}.card{background:white;border:1px solid #d3dbe5;border-radius:9px;overflow:hidden}.card h2{margin:0;padding:10px;background:#edf5ff;font-size:18px}.pad{padding:10px}label{display:block;font-weight:bold;margin:7px 0 3px}input,textarea{width:100%;padding:9px;border:1px solid #bcc7d5;border-radius:6px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px}.actions button{padding:11px 18px;border:0;border-radius:7px;color:white;font-weight:bold}.go{background:#159447}.pdf{background:#df3030}.jpg{background:#126be0}.pr{background:#596273}.inst{grid-column:span 2}.instbox{border:2px solid #347dbc;border-radius:7px;overflow:hidden}.instbox table{width:100%;border-collapse:collapse}.instbox th,.instbox td{border:1px solid #9dbddd;padding:5px;text-align:center}.instbox th{background:#eaf5ff}.sign{grid-column:span 3}.sg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sb{border:1px solid #ccd5e0;padding:8px;text-align:center;border-radius:7px}.sb canvas{width:100%;height:105px;border:1px dashed #888;touch-action:none}.preview{margin-top:15px}.preview h3{text-align:center}.paper{background:#fff;width:210mm;min-height:297mm;margin:auto;padding:12mm;border:1px solid #aaa}.pvgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pvbox{border:1px solid #444;padding:7px}.pvtable{width:100%;border-collapse:collapse;margin-top:8px}.pvtable th,.pvtable td{border:1px solid #444;padding:5px}.pvsig{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pvsig>div{border:1px solid #444;min-height:80px;text-align:center;padding:5px}.pvsig img{height:55px;max-width:100%;object-fit:contain}@media(max-width:850px){.grid{grid-template-columns:1fr}.inst,.sign{grid-column:auto}.paper{width:100%;min-height:auto;padding:15px}}@media print{body{background:white}.wrap> .head,.wrap>.grid,.actions,.preview>h3{display:none!important}.paper{border:0;box-shadow:none;width:210mm;min-height:297mm;margin:0}@page{size:A4;margin:0}}
</style></head><body><div class="wrap"><div class="head"><h1>📄 જમીન બાનાખત તૈયાર કરો</h1><div>સરળ • ઝડપી • વિશ્વસનીય</div></div>
<div class="grid">
<section class="card"><h2>🏠 જમીનની વિગતો</h2><div class="pad"><label>ગામનું નામ *</label><input id="village"><div class="row"><div><label>તાલુકો</label><input id="taluka"></div><div><label>જિલ્લો</label><input id="district"></div></div><label>સર્વે / બ્લોક નંબર</label><input id="survey"><div class="row"><div><label>ગુંઠા</label><input id="guntha" type="number" oninput="land()"></div><div><label>એકર</label><input id="acre" type="number" oninput="acres()"></div></div><label>ગુંઠા દીઠ કિંમત ₹</label><input id="rate" type="number" value="2500" oninput="land()"><label>જમીનની વિગત</label><textarea id="landdetail"></textarea></div></section>
<section class="card"><h2>👤 ખરીદનાર</h2><div class="pad"><label>નામ *</label><input id="buyer"><label>પિતાનું નામ</label><input id="bf"><label>સરનામું</label><textarea id="ba"></textarea><label>મોબાઇલ</label><input id="bm"></div></section>
<section class="card"><h2>👤 વેચનાર</h2><div class="pad"><label>નામ *</label><input id="seller"><label>પિતાનું નામ</label><input id="sf"><label>સરનામું</label><textarea id="sa"></textarea><label>મોબાઇલ</label><input id="sm"></div></section>
<section class="card"><h2>📄 બાનાખતની માહિતી</h2><div class="pad"><label>કુલ કિંમત ₹</label><input id="total" type="number" oninput="bal()"><div class="row"><div><label>બાનાપેટે ₹</label><input id="adv" type="number" value="0" oninput="bal()"></div><div><label>બાકી ₹</label><input id="rem" readonly></div></div><label>બાનાખત તારીખ</label><input id="date" type="date"><label>છેલ્લી તારીખ</label><input id="due" type="date"><label>ખાસ શરતો</label><textarea id="terms"></textarea></div></section>
<section class="card inst"><h2>📅 હપ્તાની વિગતો</h2><div class="pad"><div class="row"><div><label>કુલ હપ્તા કેટલા?</label><input id="n" type="number" min="1" max="30" value="4"></div><div style="display:flex;align-items:end"><button class="go" style="width:100%" onclick="makeInst()">+ હપ્તાની યાદી બનાવો</button></div></div><div class="instbox"><table><thead><tr><th>હપ્તા</th><th>રકમ ₹</th><th>તારીખ</th><th></th></tr></thead><tbody id="ib"></tbody></table></div></div></section>
<section class="card sign"><h2>✍️ હસ્તાક્ષર (Signature)</h2><div class="pad sg"><div class="sb"><b>ખરીદનારની સહી</b><canvas id="s1"></canvas><button onclick="clr('s1')">સાફ કરો</button></div><div class="sb"><b>વેચનારની સહી</b><canvas id="s2"></canvas><button onclick="clr('s2')">સાફ કરો</button></div><div class="sb"><b>સાક્ષી 1 ની સહી</b><canvas id="s3"></canvas><button onclick="clr('s3')">સાફ કરો</button></div><div class="sb"><b>સાક્ષી 2 ની સહી</b><canvas id="s4"></canvas><button onclick="clr('s4')">સાફ કરો</button></div></div></section>
</div><div class="actions"><button class="go" onclick="preview()">📄 બાનાખત તૈયાર કરો</button><button class="pdf" onclick="pdf()">📕 PDF માં Save કરો</button><button class="jpg" onclick="jpg()">🖼️ JPG માં Save કરો</button><button class="pr" onclick="window.print()">🖨️ Print કરો</button></div>
<div class="preview"><h3>બાનાખત Preview</h3><div id="paper" class="paper"></div></div></div>
<script>
const $=x=>document.getElementById(x),V=x=>($(x).value||"").trim(),M=x=>new Intl.NumberFormat("en-IN",{maximumFractionDigits:2}).format(Number(x)||0);
function land(){let g=+V("guntha")||0;$("acre").value=g/40||"";$("total").value=Math.round(g*(+V("rate")||0));bal()}
function acres(){let a=+V("acre")||0;$("guntha").value=a*40;land()}
function bal(){$("rem").value=Math.max(0,(+V("total")||0)-(+V("adv")||0));}
function addm(s,m){let d=new Date(s+"T00:00:00");d.setMonth(d.getMonth()+m);return d.toISOString().slice(0,10)}
function makeInst(){let n=Math.min(30,Math.max(1,+V("n")||1)),b=+$("rem").value||0,e=Math.floor(b/n*100)/100,base=V("date"),h="";for(let i=1;i<=n;i++){let a=i==n?b-e*(n-1):e;h+=`<tr><td>${i}</td><td><input class="ia" type="number" value="${a.toFixed(2)}"></td><td><input class="id" type="date" value="${base?addm(base,i):""}"></td><td><button onclick="this.closest('tr').remove();ren()">🗑️</button></td></tr>`}$("ib").innerHTML=h}
function ren(){[...$("ib").rows].forEach((r,i)=>r.cells[0].textContent=i+1);$("n").value=$("ib").rows.length}
function setup(id){let c=$(id);c.width=700;c.height=280;let x=c.getContext("2d"),d=false;c.dataset.empty=1;x.lineWidth=4;x.lineCap="round";let p=e=>{let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}};c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);c.dataset.empty=0;let q=p(e);x.beginPath();x.moveTo(q.x,q.y)};c.onpointermove=e=>{if(!d)return;let q=p(e);x.lineTo(q.x,q.y);x.stroke()};c.onpointerup=()=>d=false;c.onpointercancel=()=>d=false}
function clr(id){let c=$(id);c.getContext("2d").clearRect(0,0,c.width,c.height);c.dataset.empty=1}
function sig(id){let c=$(id);return c.dataset.empty?"":c.toDataURL()}
function E(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;"}[c]))}
function preview(){let g=+V("guntha")||0,a=g/40,t=+$("total").value||0,ad=+$("adv").value||0,r=[...$("ib").rows].map((x,i)=>`<tr><td>${i+1}</td><td>₹ ${M(x.querySelector(".ia").value)}</td><td>${x.querySelector(".id").value||"-"}</td></tr>`).join("");let S=id=>{let d=sig(id);return d?`<img src="${d}">`:""};$("paper").innerHTML=`<div style="text-align:center;border-bottom:2px solid #222"><h2>જમીન બાનાખત</h2><p>આજ રોજ જમીન વેચાણ માટે બાનાખત કરવામાં આવે છે.</p></div><div class="pvgrid"><div class="pvbox"><b>ખરીદનાર</b><br>${E(V("buyer"))}<br>પિતા: ${E(V("bf"))}<br>${E(V("ba"))}<br>મો.: ${E(V("bm"))}</div><div class="pvbox"><b>વેચનાર</b><br>${E(V("seller"))}<br>પિતા: ${E(V("sf"))}<br>${E(V("sa"))}<br>મો.: ${E(V("sm"))}</div><div class="pvbox"><b>જમીન</b><br>ગામ: ${E(V("village"))}, તાલુકો: ${E(V("taluka"))}, જિલ્લો: ${E(V("district"))}<br>સર્વે: ${E(V("survey"))}<br>${M(g)} ગુંઠા = ${a.toFixed(4)} એકર<br>${E(V("landdetail"))}</div><div class="pvbox"><b>કિંમત</b><br>કુલ: ₹ ${M(t)}<br>બાનાપેટે: ₹ ${M(ad)}<br>બાકી: ₹ ${M(t-ad)}<br>તારીખ: ${E(V("date"))}</div></div><p>વેચનાર ઉપરોક્ત જમીન ખરીદનારને કુલ ₹ ${M(t)} માં વેચવા સંમત છે. ₹ ${M(ad)} બાનાપેટે પ્રાપ્ત થયેલ છે અને બાકી રકમ નીચેના હપ્તાઓ મુજબ ચૂકવવાની રહેશે.</p><table class="pvtable"><thead><tr><th>હપ્તા</th><th>રકમ</th><th>તારીખ</th></tr></thead><tbody>${r}</tbody></table>${V("terms")?`<p><b>ખાસ શરતો:</b> ${E(V("terms"))}</p>`:""}<div class="pvsig"><div><b>ખરીદનારની સહી</b>${S("s1")}</div><div><b>વેચનારની સહી</b>${S("s2")}</div><div><b>સાક્ષી 1 ની સહી</b>${S("s3")}</div><div><b>સાક્ષી 2 ની સહી</b>${S("s4")}</div></div>`}
function pdf(){preview();setTimeout(()=>window.print(),200)}
async function jpg(){preview();await new Promise(r=>setTimeout(r,100));if(!window.html2canvas){alert("JPG માટે internet ચાલુ રાખો.");return}let c=await html2canvas($("paper"),{scale:2,backgroundColor:"#fff"}),a=document.createElement("a");a.download="banakhat.jpg";a.href=c.toDataURL("image/jpeg",.95);a.click()}
window.onload=()=>{["s1","s2","s3","s4"].forEach(setup);$("date").value=new Date().toISOString().slice(0,10);bal();makeInst();preview()}
</script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script></body></html>
